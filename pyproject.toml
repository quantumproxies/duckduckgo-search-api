[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-duckduckgo-search-api"
version = "0.1.0"
description = "DuckDuckGo search API for Python and the command line: DuckDuckGo web results with rank, title, link, snippet and source, plus the knowledge panel when DuckDuckGo shows one, as JSON or CSV. A web search step for LLM agents and RAG pipelines. Free and open source; no DuckDuckGo key or proxies needed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["duckduckgo", "duckduckgo-search", "duckduckgo-search-api", "duckduckgo-api", "duckduckgo-scraper", "search-api", "web-search", "web-search-api", "serp", "llm", "ai-agents", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
duckduckgo-search = "quanticdata_duckduckgo_search_api.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/serp-api/?utm_source=github&utm_medium=pypi&utm_campaign=duckduckgo-search-api"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/duckduckgo-search-api"
Issues = "https://github.com/quantumproxies/duckduckgo-search-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_duckduckgo_search_api" = ["spec.json", "py.typed"]
